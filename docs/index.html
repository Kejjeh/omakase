<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Omakase Finder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --purple: #534AB7;
  --blue: #378ADD;
  --gray: #B4B2A9;
  --red: #E24B4A;
  --green: #2ECC71;
  --orange: #FFA500;
  --bg: #1a1a2e;
  --card: #16213e;
  --text: #eee;
  --text-dim: #aaa;
  --border: #2a2a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; font-size: 2rem; margin-bottom: 5px; }
.subtitle { text-align: center; color: var(--text-dim); margin-bottom: 20px; font-size: 0.9rem; }
.stats-bar { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; padding: 12px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
.stat { text-align: center; }
.stat-value { font-size: 1.4rem; font-weight: 700; color: var(--purple); }
.stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; padding: 16px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
.filter-group label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
.filter-group select, .filter-group input { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.85rem; }
.chart-container { background: var(--card); border-radius: 8px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; position: relative; height: 500px; }
.legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
.table-container { background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th { position: sticky; top: 0; background: var(--bg); padding: 10px 8px; text-align: left; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 2px solid var(--border); }
th:hover { color: var(--purple); }
th.sorted-asc::after { content: ' \u25B2'; }
th.sorted-desc::after { content: ' \u25BC'; }
td { padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:hover td { background: rgba(83, 74, 183, 0.1); }
.src-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 600; }
.src-3 { background: var(--purple); color: white; }
.src-2 { background: var(--blue); color: white; }
.src-1 { background: var(--gray); color: #333; }
.visited-badge { background: var(--red); color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; }
.friend-badge { background: var(--orange); color: #412402; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 600; }
.walk-close { color: var(--green); font-weight: 600; }
.walk-mid { color: var(--text); }
.walk-far { color: var(--text-dim); }
@media (max-width: 768px) {
  .filters { grid-template-columns: 1fr 1fr; }
  .chart-container { height: 350px; }
  h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="container">
<h1>NYC Omakase Finder</h1>
<p class="subtitle">Multi-source ratings from Google Maps, Yelp &amp; The Infatuation &bull; Bubble size = review count</p>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="stat-count">0</div><div class="stat-label">Restaurants</div></div>
  <div class="stat"><div class="stat-value" id="stat-avg-rating">0</div><div class="stat-label">Avg Rating</div></div>
  <div class="stat"><div class="stat-value" id="stat-avg-price">0</div><div class="stat-label">Avg Price</div></div>
  <div class="stat"><div class="stat-value" id="stat-best-value">-</div><div class="stat-label">Best Value</div></div>
</div>

<div class="filters">
  <div class="filter-group"><label>Borough</label><select id="f-borough"><option value="">All</option><option value="Manhattan">Manhattan</option><option value="Brooklyn">Brooklyn</option></select></div>
  <div class="filter-group"><label>Neighborhood</label><select id="f-neighborhood"><option value="">All</option></select></div>
  <div class="filter-group"><label>Min Price</label><input type="number" id="f-price-min" placeholder="0" min="0"></div>
  <div class="filter-group"><label>Max Price</label><input type="number" id="f-price-max" placeholder="500" min="0"></div>
  <div class="filter-group"><label>Min Sources</label><select id="f-sources"><option value="1">1+</option><option value="2">2+</option><option value="3">3</option></select></div>
  <div class="filter-group"><label>Visited</label><select id="f-visited"><option value="">All</option><option value="yes">Visited Only</option><option value="no">Not Visited</option></select></div>
  <div class="filter-group"><label>Min Rating Pctl</label><input type="number" id="f-pctl-min" placeholder="0" min="0" max="100"></div>
  <div class="filter-group"><label>Min Composite</label><input type="number" id="f-rating-min" placeholder="0" min="0" max="5" step="0.1"></div>
  <div class="filter-group"><label>Max Walk to 4/5/6</label><input type="number" id="f-walk-max" placeholder="any" min="0"> </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Friend suggested</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>3 sources</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>2 sources</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--gray)"></div>1 source</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--red);border:2px solid var(--red)"></div>Visited</div>
</div>

<div class="chart-container"><canvas id="chart"></canvas></div>

<div class="table-container">
<table id="data-table">
<thead><tr>
  <th data-col="name">Restaurant</th>
  <th data-col="neighborhood">Neighborhood</th>
  <th data-col="min_price">Price</th>
  <th data-col="composite_rating">Composite</th>
  <th data-col="google_wilson">Google</th>
  <th data-col="yelp_wilson">Yelp</th>
  <th data-col="infatuation_5">Infat.</th>
  <th data-col="n_sources">Src</th>
  <th data-col="value_score">Value</th>
  <th data-col="rating_percentile">R.Pctl</th>
  <th data-col="subway_walk_min">4/5/6</th>
</tr></thead>
<tbody></tbody>
</table>
</div>

let filtered = [...ALL_DATA];
let sortCol = 'composite_rating';
let sortAsc = false;
let chart;

function getBorough(n) {
  if (!n) return '';
  if (n.includes('Manhattan')) return 'Manhattan';
  if (n.includes('Brooklyn')) return 'Brooklyn';
  if (n.includes('Queens')) return 'Queens';
  return '';
}

function getColor(r) {
  if (r.friend_suggested) return 'rgba(255,165,0,0.9)';
  if (r.visited) return 'rgba(226,75,74,0.8)';
  if (r.n_sources >= 3) return 'rgba(83,74,183,0.8)';
  if (r.n_sources >= 2) return 'rgba(55,138,221,0.8)';
  return 'rgba(180,178,169,0.6)';
}

function populateNeighborhoods() {
  const sel = document.getElementById('f-neighborhood');
  const hoods = [...new Set(ALL_DATA.map(r => r.neighborhood).filter(Boolean))].sort();
  hoods.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; sel.appendChild(o); });
}

function applyFilters() {
  const borough = document.getElementById('f-borough').value;
  const hood = document.getElementById('f-neighborhood').value;
  const pMin = parseFloat(document.getElementById('f-price-min').value) || 0;
  const pMax = parseFloat(document.getElementById('f-price-max').value) || 9999;
  const minSrc = parseInt(document.getElementById('f-sources').value) || 1;
  const visited = document.getElementById('f-visited').value;
  const pctlMin = parseFloat(document.getElementById('f-pctl-min').value) || 0;
  const ratingMin = parseFloat(document.getElementById('f-rating-min').value) || 0;
  const walkMax = parseFloat(document.getElementById('f-walk-max').value) || 9999;

  filtered = ALL_DATA.filter(r => {
    if (borough && getBorough(r.neighborhood) !== borough) return false;
    if (hood && r.neighborhood !== hood) return false;
    const price = r.min_price || 0;
    if (price < pMin || price > pMax) return false;
    if ((r.n_sources || 0) < minSrc) return false;
    if (visited === 'yes' && !r.visited) return false;
    if (visited === 'no' && r.visited) return false;
    if ((r.rating_percentile || 0) < pctlMin) return false;
    if ((r.composite_rating || 0) < ratingMin) return false;
    if (walkMax < 9999 && (r.subway_walk_min == null || r.subway_walk_min > walkMax)) return false;
    return true;
  });

  updateStats();
  updateChart();
  updateTable();
}

function updateStats() {
  document.getElementById('stat-count').textContent = filtered.length;
  if (filtered.length === 0) {
    document.getElementById('stat-avg-rating').textContent = '-';
    document.getElementById('stat-avg-price').textContent = '-';
    document.getElementById('stat-best-value').textContent = '-';
    return;
  }
  const avgR = filtered.reduce((s,r) => s + (r.composite_rating||0), 0) / filtered.length;
  const withPrice = filtered.filter(r => r.min_price);
  const avgP = withPrice.length ? withPrice.reduce((s,r) => s + r.min_price, 0) / withPrice.length : 0;
  const best = filtered.reduce((a,b) => (a.value_score||0) > (b.value_score||0) ? a : b);
  document.getElementById('stat-avg-rating').textContent = avgR.toFixed(2);
  document.getElementById('stat-avg-price').textContent = '$' + Math.round(avgP);
  document.getElementById('stat-best-value').textContent = best.name;
}

function updateChart() {
  const datasets = [{
    data: filtered.map(r => ({
      x: r.min_price || 0,
      y: r.composite_rating || 0,
      r: Math.max(4, Math.min(25, Math.sqrt(r.review_count || 50) * 1.5)),
      label: r.name,
      restaurant: r
    })),
    backgroundColor: filtered.map(r => getColor(r)),
    borderColor: filtered.map(r => r.friend_suggested ? 'rgba(255,165,0,1)' : r.visited ? 'rgba(226,75,74,1)' : 'rgba(255,255,255,0.3)'),
    borderWidth: filtered.map(r => r.friend_suggested ? 3 : r.visited ? 2 : 1),
  }];

  if (chart) {
    chart.data.datasets = datasets;
    chart.update();
  } else {
    chart = new Chart(document.getElementById('chart'), {
      type: 'bubble',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const r = ctx.raw.restaurant;
                const walk = r.subway_walk_min != null ? r.subway_walk_min + ' min to ' + r.nearest_456 : 'N/A';
                return [
                  r.name,
                  'Composite: ' + (r.composite_rating||0).toFixed(2) + ' | Price: $' + (r.min_price||'?'),
                  'Sources: ' + r.sources + ' | Value Pctl: ' + (r.value_percentile||0).toFixed(0) + '%',
                  '4/5/6: ' + walk
                ];
              }
            }
          }
        },
        scales: {
          x: { title: { display: true, text: 'Price ($)', color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#aaa' } },
          y: { title: { display: true, text: 'Composite Rating', color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#aaa' }, min: 3.0, max: 5.0 }
        }
      }
    });
  }
}

function walkClass(min) {
  if (min == null) return 'walk-far';
  if (min <= 10) return 'walk-close';
  if (min <= 20) return 'walk-mid';
  return 'walk-far';
}

function updateTable() {
  const sorted = [...filtered].sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av == null) av = sortAsc ? Infinity : -Infinity;
    if (bv == null) bv = sortAsc ? Infinity : -Infinity;
    if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });

  const tbody = document.querySelector('#data-table tbody');
  tbody.innerHTML = sorted.map(r => {
    const srcClass = r.n_sources >= 3 ? 'src-3' : r.n_sources >= 2 ? 'src-2' : 'src-1';
    const wMin = r.subway_walk_min;
    const wClass = walkClass(wMin);
    const walkText = wMin != null ? wMin + ' min' : '-';
    const station = r.nearest_456 || '';
    return '<tr>' +
      '<td>' + r.name + (r.friend_suggested ? ' <span class="friend-badge">Friend</span>' : '') + (r.visited ? ' <span class="visited-badge">\u2713</span>' : '') + '</td>' +
      '<td>' + (r.neighborhood || '') + '</td>' +
      '<td>$' + (r.min_price || '?') + '</td>' +
      '<td><strong>' + (r.composite_rating||0).toFixed(2) + '</strong></td>' +
      '<td>' + (r.google_wilson ? r.google_wilson.toFixed(2) : '-') + '</td>' +
      '<td>' + (r.yelp_wilson ? r.yelp_wilson.toFixed(2) : '-') + '</td>' +
      '<td>' + (r.infatuation_5 ? r.infatuation_5.toFixed(2) : '-') + '</td>' +
      '<td><span class="src-badge ' + srcClass + '">' + (r.sources||'?') + '</span></td>' +
      '<td>' + (r.value_score||0).toFixed(2) + '</td>' +
      '<td>' + (r.rating_percentile||0).toFixed(0) + '%</td>' +
      '<td class="' + wClass + '" title="' + station + '">' + walkText + '</td>' +
      '</tr>';
  }).join('');
}
